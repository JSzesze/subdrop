name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog source
        run: python3 scripts/validate.py

      - name: Build published catalog, schema, and meta
        run: python3 scripts/build-catalog.py -o dist/v1/catalog.json

      - name: Check published JSON shape
        run: python3 scripts/check-published.py dist/v1/catalog.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-json
          path: dist/v1/
