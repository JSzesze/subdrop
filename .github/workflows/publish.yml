name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        run: python3 scripts/validate.py

      - name: Build catalog, schema, and meta
        env:
          R2_PUBLIC_HOST: ${{ secrets.R2_PUBLIC_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          HOST="${R2_PUBLIC_HOST:-https://subdrop.repruv.com}"
          python3 scripts/build-catalog.py -o dist/v1/catalog.json --host "$HOST" --commit "$GITHUB_SHA"
          python3 scripts/check-published.py dist/v1/catalog.json

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload v1 JSON to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # R2 already stores ETag (MD5) + Last-Modified; If-None-Match 304 works at origin today.
          # Cache-Control alone does NOT make .json edge-cacheable: Cloudflare's default
          # cached extensions exclude JSON, so /v1/*.json stays cf-cache-status: DYNAMIC
          # until a Cache Rule marks the path Eligible for cache (see README).
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          JSON_CACHE="public, max-age=300, stale-while-revalidate=86400"
          SCHEMA_CACHE="public, max-age=86400, stale-while-revalidate=604800"
          upload() {
            local file="$1"
            local cache="$2"
            aws s3 cp "dist/v1/${file}" "s3://${R2_BUCKET_NAME}/v1/${file}" \
              --endpoint-url "$ENDPOINT" \
              --content-type "application/json; charset=utf-8" \
              --cache-control "$cache"
          }
          upload catalog.json "$JSON_CACHE"
          upload meta.json "$JSON_CACHE"
          upload schema.json "$SCHEMA_CACHE"

      - name: Sync logos to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync logos/ "s3://${R2_BUCKET_NAME}/logos/" \
            --endpoint-url "$ENDPOINT" \
            --exclude "README.md" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload browse UI to R2 root
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # Static HTML/CSS/JS at the bucket root. /v1/* keys are unchanged.
          # R2 custom domains map object keys 1:1, so /index.html works immediately.
          # GET / 404s until a URL Rewrite maps `/` → `/index.html` (see README),
          # or until an empty-key object is accepted by the bucket.
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          HTML_CACHE="public, max-age=300, stale-while-revalidate=86400"
          aws s3 cp site/index.html "s3://${R2_BUCKET_NAME}/index.html" \
            --endpoint-url "$ENDPOINT" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "$HTML_CACHE"
          aws s3 cp site/browse.css "s3://${R2_BUCKET_NAME}/browse.css" \
            --endpoint-url "$ENDPOINT" \
            --content-type "text/css; charset=utf-8" \
            --cache-control "$HTML_CACHE"
          aws s3 cp site/browse.js "s3://${R2_BUCKET_NAME}/browse.js" \
            --endpoint-url "$ENDPOINT" \
            --content-type "text/javascript; charset=utf-8" \
            --cache-control "$HTML_CACHE"
          if aws s3api put-object \
            --bucket "${R2_BUCKET_NAME}" \
            --key "" \
            --body site/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "$HTML_CACHE" \
            --endpoint-url "$ENDPOINT"; then
            echo "Uploaded empty-key object for GET /"
          else
            echo "Empty-key upload skipped or rejected; /index.html is published. Add the URL Rewrite in README if / still 404s."
          fi
