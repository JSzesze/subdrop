name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        run: python3 scripts/validate.py

      - name: Build catalog with CDN host
        env:
          R2_PUBLIC_HOST: ${{ secrets.R2_PUBLIC_HOST }}
        run: |
          HOST="${R2_PUBLIC_HOST:-https://subdrop.repruv.com}"
          python3 scripts/build-catalog.py -o dist/v1/catalog.json --host "$HOST"

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload catalog.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp dist/v1/catalog.json "s3://${R2_BUCKET_NAME}/v1/catalog.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=300"

      - name: Sync logos to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync logos/ "s3://${R2_BUCKET_NAME}/logos/" \
            --endpoint-url "$ENDPOINT" \
            --exclude "README.md" \
            --cache-control "public, max-age=31536000, immutable"
